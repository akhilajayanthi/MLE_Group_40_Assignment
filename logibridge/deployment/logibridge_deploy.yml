# LogiEdge edge-node deployment. Idempotent: a second run with no changes reports changed=0.
# Requires: community.docker >= 3.8 (ansible-galaxy collection install community.docker),
#           Docker + Python docker SDK on the edge node, image pushed to the local registry.
# Run:      ansible-playbook -i inventory.ini logibridge_deploy.yml
- name: Deploy LogiEdge inference service
  hosts: edge
  become: true
  vars:
    app_dir: /opt/logibridge
    container: logibridge-inference
    image: localhost:5000/logibridge-inference:latest
    truck_id: TRK001

  tasks:
    - name: Create /opt/logibridge directory if not present
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Copy new model file
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../inference/model.tflite"
        dest: "{{ app_dir }}/model.tflite"
        mode: "0644"
      register: model_file

    - name: Copy updated reference_dist.json
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../monitoring/reference_dist.json"
        dest: "{{ app_dir }}/reference_dist.json"
        mode: "0644"
      register: ref_file

    - name: Stop the running inference container if running
      # only when a new model/reference arrived, so an unchanged re-run stays changed=0
      ansible.builtin.shell: "docker ps -q -f name=^{{ container }}$ | xargs -r docker stop"
      when: model_file.changed or ref_file.changed

    - name: Pull updated container image from local Docker registry
      community.docker.docker_image_pull:
        name: "{{ image }}"
        pull: always

    - name: Start inference container with environment variables
      community.docker.docker_container:
        name: "{{ container }}"
        image: "{{ image }}"
        state: started
        restart_policy: unless-stopped
        network_mode: host
        volumes:
          - "{{ app_dir }}:/models"
        env:
          MODEL_PATH: /models/model.tflite
          TRUCK_ID: "{{ truck_id }}"
          MQTT_HOST: localhost
          MQTT_PORT: "1883"
          ALERT_LOG: /models/alerts.jsonl

    - name: Wait 15 seconds and verify container is running
      ansible.builtin.shell: "sleep 15 && docker ps -q -f name=^{{ container }}$ -f status=running"
      register: running
      changed_when: false
      failed_when: running.stdout == ""
