# Mosquitto on the truck edge node (Mosquitto 2.x).
# Sensors, inference and alerts all stay on this local broker, so the truck works with no cellular link.
listener 1883 localhost
allow_anonymous true

# Persist queued QoS 1 messages to disk so alerts survive a broker/edge reboot during a coverage gap
persistence true
persistence_location /var/lib/mosquitto/

# Bridge to the operations centre. Only alerts and inference summaries leave the truck - never raw sensor data.
# While the link is down, QoS 1 messages are queued; when coverage returns the bridge reconnects and flushes them.
# Uncomment and set the ops-centre address/certificates for a real deployment:
#connection ops-centre
#address ops.freightbridge.example:8883
#bridge_cafile /etc/mosquitto/certs/ca.crt
#bridge_certfile /etc/mosquitto/certs/truck.crt
#bridge_keyfile /etc/mosquitto/certs/truck.key
#cleansession false
#start_type automatic
#restart_timeout 10 120
#max_queued_messages 100000
#topic logibridge/trucks/+/alerts out 1
#topic logibridge/trucks/+/inference out 1
#topic logibridge/trucks/+/ota/# in 1
